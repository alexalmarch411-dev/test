services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      MONGO_URI: "mongodb://mongo:27017"
      PORT: "8080"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
