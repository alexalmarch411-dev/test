apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-web-to-mongo
spec:
  podSelector:
    matchLabels:
      app: {{ .Release.Name }}-mongodb
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: {{ .Release.Name }}-web
      ports:
        - port: 27017
          protocol: TCP
  policyTypes:
    - Ingress